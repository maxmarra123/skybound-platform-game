<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skybound: Brutus' Stadium Run</title>
<style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#10162e;font-family:ui-rounded,system-ui}#wrap{width:min(100vw,1100px);padding:16px}canvas{display:block;width:100%;max-height:82vh;aspect-ratio:16/9;border-radius:22px;box-shadow:0 24px 90px #030819aa;touch-action:none}.hint{color:#d9e5ff;text-align:center;font-size:.85rem}kbd{padding:2px 7px;border-radius:6px;background:#2a3966;border:1px solid #6477ad}</style></head>
<body><main id="wrap"><canvas id="game" width="1280" height="720" aria-label="Skybound platform game"></canvas><p class="hint"><kbd>←</kbd> <kbd>→</kbd> or <kbd>A</kbd> <kbd>D</kbd> to move · <kbd>Space</kbd> / <kbd>W</kbd> / <kbd>↑</kbd> to jump · <kbd>Esc</kbd> level select</p></main>
<script>(()=>{const c=document.querySelector('canvas'),x=c.getContext('2d'),W=1280,H=720,K=new Set(),SAVE='skybound-stadium-v3',old=JSON.parse(localStorage.getItem(SAVE)||'{}');let open=Math.max(0,old.open||0),best=old.best||{},screen='title',i=0,L,gems=[],foes=[],items=[],clock=0,total=0,t=0,jump=0,win=0,audio=0;const p={x:70,y:520,w:36,h:48,vx:0,vy:0,g:0,life:3,score:0,face:1,air:1,shield:0,speed:0,run:0,party:0};
const lv=[
['Cloudstep Meadow',['#70c9f2','#bde9ff'],[[0,642,280,78],[220,565,154,26],[424,500,128,26],[610,428,126,26],[785,500,145,26],[990,416,125,26],[1115,570,165,150],[892,310,150,24],[648,273,135,24],[400,340,124,24],[157,405,112,24]],[[545,625,42],[930,625,48]],[[300,515],[472,450],[668,375],[853,445],[1046,363],[961,259],[703,222],[455,289],[207,355]],[804,470],[1180,480],[610,380],[[482,447,'⚡']]],
['Moonlit Ruins',['#24275f','#f1a6c5'],[[0,642,205,78],[265,554,112,26],[445,470,100,26],[620,548,92,26],[785,455,112,26],[965,365,104,26],[1130,510,150,210],[925,245,100,24],[715,320,95,24],[520,270,95,24],[320,350,92,24],[142,435,90,24]],[[377,625,56],[712,625,58],[895,625,65]],[[315,505],[495,420],[665,497],[840,405],[1016,315],[975,195],[760,270],[567,220],[365,300],[185,386]],[790,425],[1190,420],[715,270],[[760,262,'S']]],
['Sunspire Summit',['#3d194f','#ffd477'],[[0,642,165,78],[226,570,82,26],[374,500,76,26],[520,427,74,26],[663,355,72,26],[807,425,72,26],[955,342,76,26],[1115,445,165,275],[930,226,72,24],[774,255,70,24],[610,205,70,24],[442,275,70,24],[282,335,70,24],[125,415,70,24]],[[165,625,80],[308,625,95],[450,625,95],[594,625,95],[735,625,95],[878,625,95],[1032,625,88]],[[267,520],[412,450],[557,378],[700,306],[843,377],[993,294],[965,177],[810,205],[645,155],[477,225],[317,285],[160,365]],[665,325],[1195,355],[775,220],[[645,155,'2']]],
['Ohio Stadium Championship',['#86d8fb','#f7b35f'],[[0,642,230,78],[260,560,118,26],[450,478,118,26],[645,560,105,26],[820,470,125,26],[1010,560,95,26],[1120,420,160,300],[670,340,140,24],[905,280,110,24],[1080,200,100,24]],[[378,625,70],[752,625,70],[945,625,65]],[[315,510],[500,428],[700,510],[875,420],[1060,510],[735,290],[955,230],[1128,150]],[835,435],[1190,308],[820,420],[[700,292,'S'],[955,232,'2']]]];
const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y,save=()=>localStorage.setItem(SAVE,JSON.stringify({open,best}));
function beep(f,d=.08){if(!audio)return;let q=beep.q||(beep.q=new AudioContext()),o=q.createOscillator(),g=q.createGain();o.frequency.value=f;g.gain.value=.05;o.connect(g).connect(q.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,q.currentTime+d);o.stop(q.currentTime+d)}
function load(n,fresh=1){i=n;L=lv[n];gems=L[4].map(v=>({x:v[0],y:v[1],on:1}));foes=[{x:L[5][0],y:L[5][1],w:34,h:30,d:1}];items=L[8].map(v=>({x:v[0],y:v[1],type:v[2],on:1}));Object.assign(p,{x:70,y:520,vx:0,vy:0,g:0,life:3,score:0,air:1,shield:0,speed:0,party:0});clock=0;if(fresh)total=0;screen='play'}
function hurt(){if(p.shield){p.shield=0;beep(760);return}p.life--;beep(130,.2);if(!p.life)return load(0);let s=[70,520];Object.assign(p,{x:s[0],y:s[1],vx:0,vy:0});gems.forEach(g=>g.on=1);items.forEach(g=>g.on=1)}
addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['arrowleft','arrowright','arrowup',' ','a','d','w','escape'].includes(k))e.preventDefault();K.add(k);if([' ','arrowup','w'].includes(k))jump=1;if(k==='escape'&&screen==='play')screen='select'});addEventListener('keyup',e=>K.delete(e.key.toLowerCase()));
c.onpointerdown=e=>{audio=1;let r=c.getBoundingClientRect(),X=(e.clientX-r.left)*W/r.width,Y=(e.clientY-r.top)*H/r.height;if(screen==='title')screen='select';else if(screen==='select'){let n=Math.floor((X-160)/240);if(n>=0&&n<4&&n<=open)load(n)}else if(screen==='next')load(i+1,0);else if(screen==='won')screen='title';else jump=1};
function up(d){t+=d;if(screen!=='play')return;clock+=d;total+=d;p.shield=Math.max(0,p.shield-d);p.speed=Math.max(0,p.speed-d);let dir=(K.has('arrowright')||K.has('d')?1:0)-(K.has('arrowleft')||K.has('a')?1:0),v=p.speed?410:310;p.vx+=(dir*v-p.vx)*Math.min(1,d*7);if(dir){p.face=dir;p.run+=d*14}p.coyote=p.g?.1:Math.max(0,p.coyote-d);if(jump&&(p.g||p.air)){if(!p.g)p.air--;p.vy=-590;p.g=0;beep(390)}jump=0;p.vy=Math.min(760,p.vy+1540*d);p.x=Math.max(0,Math.min(W-p.w,p.x+p.vx*d));p.y+=p.vy*d;p.g=0;for(let a of L[2])if(hit(p,{x:a[0],y:a[1],w:a[2],h:a[3]})&&p.vy>=0&&p.y+p.h-p.vy*d<=a[1]+8){p.y=a[1]-p.h;p.vy=0;p.g=1;p.air=1}let f=foes[0],champ=L[0].includes('Championship'),alive=!champ||(f.hits||0)<5;if(alive){f.x+=f.d*75*d;if(f.x<680||f.x>1000)f.d*=-1;if(champ&&p.vy>80&&hit(p,{x:f.x,y:f.y,w:65,h:34})){f.hits=(f.hits||0)+1;p.vy=-430;beep(800)}else if(hit(p,f))hurt();}if(L[3].some(a=>hit(p,{x:a[0],y:a[1],w:a[2],h:22})))hurt();for(let g of gems)if(g.on&&Math.hypot(p.x+18-g.x,p.y+24-g.y)<35){g.on=0;p.score++;beep(760)}for(let z of items)if(z.on&&Math.hypot(p.x+18-z.x,p.y+24-z.y)<34){z.on=0;if(z.type==='S')p.shield=12;if(z.type==='⚡')p.speed=12;if(z.type==='2')p.air=2;beep(990)}let goal=L[6];if(gems.every(g=>!g.on)&&Math.hypot(p.x+18-goal[0],p.y+24-goal[1])<55&&(!L[0].includes('Championship')||f.hits>=5)){let score=Math.ceil(clock);if(!best[i]||score<best[i])best[i]=score;open=Math.max(open,Math.min(3,i+1));save();beep(1040,.2);p.party=3;screen=i===3?'won':'next'}if(p.y>800)hurt()}
function rr(a,b,d,e,r,col){x.fillStyle=col;x.beginPath();x.roundRect(a,b,d,e,r);x.fill()}function stadium(){x.fillStyle='#789eb8';x.fillRect(0,188,W,250);x.fillStyle='#dce8f0';x.fillRect(0,198,W,13);for(let y=220;y<410;y+=20){x.fillStyle='#871638';x.fillRect(0,y,W,9);x.fillStyle='#b43254';for(let q=(y%40?0:35);q<W;q+=70)x.fillRect(q,y+10,38,8)}x.fillStyle='#4f5d67';x.fillRect(0,409,W,28);let field=x.createLinearGradient(0,435,0,H);field.addColorStop(0,'#4c9762');field.addColorStop(1,'#1e5938');x.fillStyle=field;x.fillRect(0,435,W,285);x.strokeStyle='#dcefd9';x.globalAlpha=.72;x.lineWidth=3;for(let q=80;q<W;q+=120){x.beginPath();x.moveTo(q,435);x.lineTo(q,H);x.stroke()}x.globalAlpha=1;rr(500,65,280,85,8,'#1d2d49');x.strokeStyle='#7187aa';x.lineWidth=2;x.strokeRect(500,65,280,85);x.fillStyle='#e2264e';x.font='bold 20px Arial';x.textAlign='center';x.fillText('OHIO STADIUM',640,103);x.fillStyle='#fff';x.font='bold 14px Arial';x.fillText('HOME OF BRUTUS',640,130);x.textAlign='left'}function platform(a){let[A,B,C,D]=a;x.save();x.shadowColor='#10182d99';x.shadowBlur=13;x.shadowOffsetY=8;rr(A,B,C,D,10,'#382451');x.restore();rr(A-2,B-2,C+4,D+4,11,'#d9eaff');rr(A,B,C,D,9,'#40255f');rr(A,B,C,10,8,'#9ff0a9');x.fillStyle='#63417f';x.fillRect(A+8,B+14,C-16,Math.max(7,D-18));x.fillStyle='#d8ffd9';x.globalAlpha=.55;x.fillRect(A+8,B+3,C-16,2);x.globalAlpha=1}
function brutus(){let st=p.vy<-90?.12:0,sq=p.g?Math.sin(p.run)*.04:0;x.save();x.translate(p.x+18,p.y+24+(p.party?Math.sin(t*15)*6:0));x.scale(p.face*(1-st+sq),1+st-sq);x.fillStyle='#492018';x.beginPath();x.ellipse(0,-7,21,23,0,0,7);x.fill();x.fillStyle='#c8c2aa';x.beginPath();x.ellipse(3,-7,13,15,0,0,7);x.fill();x.fillStyle='#1c1b20';x.beginPath();x.ellipse(-2,-11,4,6,0,0,7);x.ellipse(10,-10,4,6,0,0,7);x.fill();x.fillStyle='#bfc1c5';x.fillRect(-20,-29,40,8);x.fillStyle='#ba0c2f';x.font='bold 13px Arial';x.textAlign='center';x.fillText('O',0,-22);x.fillStyle='#b80b2e';x.fillRect(-14,11,28,15);x.fillStyle='#fff';x.font='bold 6px Arial';x.fillText('BRUTUS',0,21);x.fillStyle='#b80b2e';x.fillRect(-15,25,12,8);x.fillRect(3,25,12,8);if(p.shield){x.strokeStyle='#70e5ff';x.lineWidth=3;x.beginPath();x.arc(0,0,34,0,7);x.stroke()}x.restore();x.textAlign='left'}
function world(){let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,L[1][0]);g.addColorStop(1,L[1][1]);x.fillStyle=g;x.fillRect(0,0,W,H);stadium();for(let a of L[2])platform(a)for(let a of L[3]){x.fillStyle='#e85a7f';for(let q=a[0];q<a[0]+a[2];q+=17){x.beginPath();x.moveTo(q,a[1]+21);x.lineTo(q+8,a[1]);x.lineTo(q+17,a[1]+21);x.fill()}}for(let g of gems)if(g.on){x.fillStyle='#ffe76a';x.save();x.translate(g.x,g.y+Math.sin(t*4+g.x)*5);x.rotate(t*2);x.fillRect(-8,-8,16,16);x.restore()}for(let z of items)if(z.on){x.fillStyle=z.type==='S'?'#70e5ff':z.type==='2'?'#d7a6ff':'#ff8ad3';x.beginPath();x.arc(z.x,z.y,14,0,7);x.fill();x.fillStyle='#17264b';x.font='bold 14px Arial';x.textAlign='center';x.fillText(z.type,z.x,z.y+5)}let f=foes[0],champ=L[0].includes('Championship'),hp=5-(f.hits||0);if(!champ||hp>0){x.fillStyle=champ?'#96122f':'#334273';rr(f.x,f.y,f.w+(champ?30:0),f.h,12,x.fillStyle);x.fillStyle='#fff';x.font='bold 11px Arial';x.fillText(champ?'RIVAL CAPTAIN':'RIVAL',f.x,f.y-8)}if(champ){rr(850,38,200,22,8,'#3d1830');rr(854,42,192*Math.max(0,hp)/5,14,6,'#e75068');x.fillStyle='#fff';x.font='bold 13px Arial';x.fillText(hp>0?'RIVAL CAPTAIN  ♥ '+hp+'/5':'RIVAL CAPTAIN DEFEATED!',850,31);if(!hp){x.fillStyle='#ffe56a';x.font='bold 20px Arial';x.fillText('DEFEATED!',f.x-5,f.y-15)}}let goal=L[6];x.fillStyle='#7a4ca0';x.fillRect(goal[0]-3,goal[1]-74,6,75);rr(goal[0]-28,goal[1]-74,54,28,7,'#ffd55b');brutus();rr(22,20,370,65,17,'#17264bdd');x.fillStyle='#fff';x.font='bold 19px Arial';x.fillText('SKYBOUND · '+(i+1)+'/4',42,45);x.fillStyle='#ffe56a';x.font='bold 16px Arial';x.fillText('✦ '+p.score+'/'+gems.length+'   ♥ '+p.life+'   ⏱ '+clock.toFixed(1)+'s',42,69)}
function over(title,sub,but){x.fillStyle='#0d1634dd';x.fillRect(0,0,W,H);rr(290,150,700,420,32,'#243e74');x.textAlign='center';x.fillStyle='#ffe56a';x.font='bold 54px Arial';x.fillText(title,640,245);x.fillStyle='#fff';x.font='21px Arial';x.fillText(sub,640,300);rr(470,400,340,70,18,'#b80b2e');x.fillStyle='#fff';x.font='bold 24px Arial';x.fillText(but,640,444);x.textAlign='left'}
function draw(){if(screen==='title'){x.fillStyle='#1a315e';x.fillRect(0,0,W,H);stadium();over('SKYBOUND','Brutus’ Stadium Run','CLICK TO PLAY')}else if(screen==='select'){x.fillStyle='#111b3d';x.fillRect(0,0,W,H);stadium();x.textAlign='center';x.fillStyle='#ffe56a';x.font='bold 46px Arial';x.fillText('CHOOSE YOUR RUN',640,150);lv.forEach((z,n)=>{let X=160+n*240,lock=n>open;rr(X,250,200,230,18,lock?'#354260':'#385a86');x.fillStyle=lock?'#a0a9bb':'#ffe56a';x.font='bold 19px Arial';x.fillText(lock?'LOCKED':'LEVEL '+(n+1),X+100,295);x.fillStyle='#fff';x.font='16px Arial';x.fillText(z[0],X+100,335);x.font='42px Arial';x.fillText(lock?'🔒':n===3?'★':'▶',X+100,410);x.font='14px Arial';x.fillText(best[n]?'Best: '+best[n]+'s':lock?'Finish earlier levels':'Ready!',X+100,450)});x.font='17px Arial';x.fillStyle='#d7e6ff';x.fillText('Progress and best times save automatically.',640,580);x.textAlign='left'}else{world();if(screen==='next')over('LEVEL COMPLETE!','Your progress and best time were saved.','NEXT LEVEL');if(screen==='won')over('CHAMPIONSHIP WON!','Total time: '+total.toFixed(1)+' seconds!','PLAY AGAIN')}}
let last=performance.now();requestAnimationFrame(function loop(n){let d=Math.min(.033,(n-last)/1000);last=n;up(d);draw();requestAnimationFrame(loop)})})()</script></body></html>
